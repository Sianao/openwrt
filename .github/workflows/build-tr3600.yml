name: Build Cudy TR3600 v1 (mediatek/filogic)

on:
  push:
    branches:
      - tr3600-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: mediatek/filogic cudy_tr3600-v1
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev rsync \
            unzip zlib1g-dev file wget quilt ccache python3 python3-setuptools

      - name: Configure for a single device
        run: |
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y"
            echo "CONFIG_CCACHE=y"
          } > .config
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          grep -E "^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)" .config || true

      - name: Download sources
        run: make -j"$(nproc)" download

      - name: Build firmware
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" 2>&1 | tee build.log; then
            echo "build failed, last 200 log lines:"
            tail -200 build.log
            exit 1
          fi
          tail -5 build.log

      - name: Collect images
        run: |
          mkdir -p out
          cp -v bin/targets/mediatek/filogic/*sysupgrade* out/ 2>/dev/null || true
          cp -v bin/targets/mediatek/filogic/*.manifest out/ 2>/dev/null || true
          cp -v bin/targets/mediatek/filogic/sha256sums out/ 2>/dev/null || true
          ls -lh out

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudy-tr3600-v1-images
          path: out/*
          if-no-files-found: warn

      - name: Write release notes
        if: success()
        run: |
          cat > release-notes.md <<'NOTES'
          mediatek/filogic image for the Cudy TR3600 v1.

          Built from openwrt PR #24581 (mediatek: add support for Cudy TR3600 v1)
          plus a local follow-up commit fixing the status LED colour (GPIO48 is
          white, not blue) and the 2.4 GHz MAC offset (bdinfo +0, matching the
          stock firmware layout).

          This is an unverified community build: the fan control and the MAC
          layout have not been validated by the PR author on real hardware.
          Flash at your own risk and keep a stock firmware backup.
          NOTES

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="tr3600-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" out/* \
            --title "Cudy TR3600 v1 test image ($tag)" \
            --notes-file release-notes.md
